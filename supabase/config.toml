project_id = "spendslip"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirmation_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true

[functions.rollover-bills]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false
